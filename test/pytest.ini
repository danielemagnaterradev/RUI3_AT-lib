[pytest]
# ---------------------------------------------------------------------------
# rui3pylib — pytest configuration
# ---------------------------------------------------------------------------
testpaths  = tests
pythonpath = .

python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# Show every assertion detail on failure
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Custom markers
markers =
    happy_path:     nominal behaviour with valid input
    validation:     input-validation / guard-clause logic
    boundary:       values exactly at, just inside, and just outside valid ranges
    cmd_format:     the AT command string sent to the device is verified exactly
    device_error:   device returns AT_PARAM_ERROR / AT_BUSY_ERROR / etc.
    bootloader:     commands that operate only in boot mode
    lorawan:        LoRaWAN-specific commands
    p2p:            P2P / FSK commands
    rf_test:        RF test and certification commands
